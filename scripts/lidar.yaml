# PNOA-LiDAR tile downloader configuration.
#
# PNOA-LiDAR data for the Comunitat Valenciana is republished by the ICV
# (Institut Cartogràfic Valencià) at descargas.icv.gva.es as direct HTTP
# downloads. Files are organised on a regular 2 km grid in EPSG:25830 and
# named after the south-west corner of each tile expressed in kilometres.
#
# To switch to another coverage (e.g. the 2017 PCAS or 2009 CVAL series),
# point `url_template` and `product` at the matching ICV path — the
# directory structure and filename pattern are consistent across years.

source:
  product: "PNOA-LIDAR-2015-PVAL-0005"
  # `{x_km}` / `{y_km}` are integer kilometres of the SW corner of each
  # 2 km tile (EPSG:25830). The script also exposes `{x_m}` / `{y_m}`
  # if a future template needs the raw metric coordinates.
  url_template: "https://descargas.icv.gva.es/dcd/03_mde/01_lidar/2015_PVAL_0005/01_Nube/01_25830_05_CP_03_IRG_13_LAZ/030101_2015PVAL0005_25830_CP_IRG_{x_km}-{y_km}.laz"

output:
  db_path: "data/lidar_tiles.duckdb"

tiling:
  # Valencia is in UTM zone 30N → ETRS89 / UTM 30N (EPSG:25830).
  srs: "EPSG:25830"
  # 2 km × 2 km grid, aligned so cell corners fall on whole kilometres
  # (matches the ICV filename convention).
  tile_size_m: 2000.0
  grid_origin: [0.0, 0.0]

# LiDAR files are large (often hundreds of MB per tile), so default to
# fewer concurrent fetches than the orthophoto downloader.
parallelism:
  max_workers: 4

http:
  timeout: 300.0
  chunk_size: 1048576  # 1 MiB

# Clip bbox in CRS units (EPSG:25830 / UTM 30N). Defaults to the city of
# Valencia municipal extent — every grid cell intersecting this bbox is
# attempted, and tiles outside the published coverage are recorded as
# misses so they aren't retried on rerun.
bbox:
  x_min: 720000.0
  y_min: 4365000.0
  x_max: 735000.0
  y_max: 4380000.0
