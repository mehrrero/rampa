# Orthophoto tile downloader configuration.

wms:
  url: "https://terramapas.icv.gva.es/0202_2025PVAL0015"
  version: "1.3.0"

output:
  db_path: "data/ortho_tiles.duckdb"

tiling:
  srs: "EPSG:25830"
  tile_size_m: 1024.0
  pixels_per_tile: 4096
  image_format: "image/tiff"

# Number of concurrent WMS fetches. Tile saves go through a single DuckDB
# connection guarded by a lock, so this controls download parallelism.
parallelism:
  max_workers: 8

# Layers to download. Leave empty to download every layer advertised by the WMS.
layers: []

# Clip bbox in CRS units (EPSG:25830 / UTM 30N). Defaults to the city of
# Valencia municipal extent — every layer is intersected with this bbox.
bbox:
  x_min: 720000.0
  y_min: 4365000.0
  x_max: 735000.0
  y_max: 4380000.0
