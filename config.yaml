# Global project configuration.
#
# Shared values live at the top level. Per-script settings are namespaced
# under the script name.

# CRS of every coordinate stored in this project (graph, nodes/edges in
# DuckDB, sidewalk widths, ...). Matches the tile2net source graph.
crs: "EPSG:25830"

# Used by scripts/initialize.py
initialize:
  paths:
    graph_path: "data/graph.gpickle"
    db_path: "data/network.duckdb"
    dem_path: "data/mdt_lidar.tif"
  # Edge attributes to copy from the source graph onto the `edges` table
  # (in addition to the implicit `length` -> `distance` mapping).
  attributes:
    - width
  # Per-edge elevation derived from a DEM raster (PNOA-LiDAR MDT05 by default).
  # Comment out the whole block to skip elevation during `make initialize`.
  elevation:
    samples_per_edge: 8
    # If `dem_path` doesn't already exist, fetch this WCS coverage into it.
    wcs_url: "https://servicios.idee.es/wcs-inspire/mdt"
    coverage_id: "Elevacion4258_5"
    coverage_crs: "EPSG:4258"
    bbox_pad_m: 50.0
  # Accessibility cost model (alt_distance) — Option 2 from
  # docs/alt_distance_proposal.pdf:
  #   alt_distance = distance * exp(k_up*max(s,0) + k_down*max(-s,0))
  #                            / 10^accesibility
  # Defaults are CTE-anchored: k_up = ln(10)/0.06 (TMA/851 6% itinerary
  # limit), k_down = ln(10)/0.10 (DB-SUA 1 §4.3 steepest short-ramp limit).
  accessibility:
    width_threshold: 1.50
    k_up: 38.0
    k_down: 23.0
    # Clamp |slope| before the exponential so DEM noise on near-zero-length
    # edges (5 m raster, sub-metre segments) can't push exp(k*s) to +inf.
    # 0.30 is well above any real accessible grade.
    slope_cap: 0.30
