# Global project configuration.
#
# Shared values live at the top level. Per-script settings are namespaced
# under the script name.

# Default CRS of coordinates stored in this project (graph, nodes/edges in
# DuckDB, sidewalk widths, ...). Matches the tile2net source graph. Each city
# may override this with its own `crs` (see initialize.cities below).
crs: "EPSG:25830"

# Used by scripts/initialize.py
initialize:
  paths:
    # Single DuckDB holding every city. `initialize` writes one
    # `nodes_<city>` / `edges_<city>` table pair per entry in `cities` below.
    db_path: "data/network.duckdb"

  # Cities to build, each from its own source graph. The `name` becomes the
  # table suffix (slugified to a safe SQL identifier), so the API can select a
  # city by name. `graph_path` is the pickled (tile2net-style) source graph.
  #
  # `crs` is optional and overrides the top-level default — set it when a city's
  # graph uses a different projection (e.g. a different UTM zone).
  #
  # The DEM raster is fetched automatically (see the `elevation` block) and
  # cached next to the database as `mdt_<city>.tif`, so there's no path to set.
  #
  # Per-city `overlay` is optional — it pulls city-specific open-data layers
  # (kerbs + type-A PMV lanes) from ArcGIS REST services. Omit the block for a
  # city with no such layers; the kerb / veh_a columns are simply skipped.
  cities:
    - name: valencia
      graph_path: "data/valencia.gpickle"
      crs: "EPSG:25830"
      overlay:
        kerb_url: "https://geoportal.valencia.es/server/rest/services/OPENDATA/UrbanismoEInfraestructuras/MapServer/307"
        type_a_url: "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer/2"
        # Max distance (m) for an edge to pick up a kerb / lane feature.
        kerb_tol_m: 4.0
        lane_tol_m: 5.0

    - name: madrid
      graph_path: "data/madrid.gpickle"
      crs: "EPSG:25830"
      overlay:
        kerb_url: ""
        type_a_url: ""
        # Max distance (m) for an edge to pick up a kerb / lane feature.
        kerb_tol_m: 4.0
        lane_tol_m: 5.0

  # Edge attributes to copy from the source graph onto each `edges` table
  # (in addition to the implicit `length` -> `distance` mapping).
  attributes:
    - width

  # Per-edge elevation derived from a DEM raster (PNOA-LiDAR MDT05 by default).
  # Shared across cities (same national WCS source); each city's raster is
  # cached at its own `dem_path`. Comment out the whole block to skip elevation.
  elevation:
    samples_per_edge: 8
    # If a city's `dem_path` doesn't already exist, fetch this WCS coverage.
    wcs_url: "https://servicios.idee.es/wcs-inspire/mdt"
    coverage_id: "Elevacion4258_5"
    coverage_crs: "EPSG:4258"
    bbox_pad_m: 50.0

  # Accessibility cost model (alt_distance) — Option 2 from
  # docs/alt_distance_proposal.pdf:
  #   alt_distance = distance * exp(k_up*max(s,0) + k_down*max(-s,0))
  #                            / 10^accesibility
  # Defaults are CTE-anchored: k_up = ln(10)/0.06 (TMA/851 6% itinerary
  # limit), k_down = ln(10)/0.10 (DB-SUA 1 §4.3 steepest short-ramp limit).
  # Shared across cities.
  accessibility:
    width_threshold: 1.50
    k_up: 38.0
    k_down: 23.0
    # Clamp |slope| before the exponential so DEM noise on near-zero-length
    # edges (5 m raster, sub-metre segments) can't push exp(k*s) to +inf.
    # 0.30 is well above any real accessible grade.
    slope_cap: 0.30
    # Crossing-based kerb penalty (Option 5): alt_distance is multiplied by
    # exp(k_kerb * min(kerb_cross, kerb_cross_cap)), where kerb_cross counts
    # kerb lines the edge crosses. ln(10) ≈ 2.3026 makes each crossing cost one
    # accessibility tier (×10); a two-kerb street crossing then costs ×100.
    k_kerb: 2.302585092994046
    # Clamp kerb_cross before the exponential. A real crossing traverses at most
    # 2 curbs; higher counts are fragmented-kerb-layer artifacts on long/skewed
    # edges, and uncapped they blow alt_distance up to ~1e18 (10^16), which
    # makes pandana's contraction-hierarchy build pathologically slow.
    kerb_cross_cap: 2

# Used by src/api.py
api:
  # Traversal speeds (m/s) used to estimate each route's travel time from its
  # total length. Reported in the per-route metadata as "X h Y min".
  travel_speeds:
    walking: 1.24
    wheelchair: 0.7

  # Networks are no longer built eagerly at import — each city's Network
  # (and its routing pandana graphs) is loaded on first use and then kept in
  # memory for this many seconds of inactivity before being released, so an
  # idle server doesn't hold every configured city's network in RAM. Any
  # `/ruta` request for a city resets its timer; `GET /health` is what
  # triggers the (lazy) load in the first place.
  network_idle_ttl_seconds: 10
